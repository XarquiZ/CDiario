<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDiario - {{ turma_nome }} ({{ turno }})</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    .nav-tab {
      min-width: 120px;
    }
    nav, #content-area, .main-container, #notas-container, #advertencias-container, #boletins-container, #chamada-container {
      width: 100% !important;
      box-sizing: border-box !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    nav {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    .main-container {
      padding-left: 4% !important;
      padding-right: 4% !important;
      display: flex;
      flex-direction: column;
    }
    #content-area, #notas-container, #advertencias-container, #boletins-container, #chamada-container {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: 100% !important;
    }
    @media (min-width: 768px) {
      .main-container {
        flex-direction: column;
        width: 100%;
      }
      #content-area, #notas-container, #advertencias-container, #boletins-container, #chamada-container {
        width: 100%;
        max-width: none;
        margin-right: 0;
      }
    }
  </style>
</head>
<body class="bg-[#F8FAFF] min-h-screen">
  <!-- Header do Diário -->
  <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 bg-white sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-4 text-sm text-gray-700">
      <button class="flex items-center gap-2 font-medium hover:text-blue-600 transition" onclick="window.location.href='/professor'">
        <i class="fas fa-arrow-left"></i>
        <span>Turmas</span>
      </button>
      <div class="h-5 w-px bg-gray-200"></div>
      <div class="flex items-center gap-2">
        <h1 class="font-bold text-gray-900 text-base md:text-lg">{{ turma_nome }}</h1>
        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">{{ turno }}</span>
        <span id="turma-tipo-badge" class="hidden text-xs px-2.5 py-0.5 rounded-full font-semibold"></span>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Botão para Vincular Turma Oficial ao Classroom do Professor -->
      <button id="btn-vincular-classroom-turma" onclick="abrirModalVincularClassroom()" class="hidden items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
        <i class="fab fa-google text-emerald-600"></i>
        <span>Vincular ao Classroom</span>
      </button>

      <!-- Botão de Sincronizar (quando já vinculado) -->
      <button id="btn-sync-classroom-turma" onclick="sincronizarEstaTurma(this)" class="hidden items-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
        <i class="fab fa-google text-emerald-600"></i>
        <span>Sincronizar Classroom</span>
      </button>

      <!-- Botão Config / Opções de vínculo -->
      <button id="btn-opcoes-classroom-turma" onclick="abrirModalVincularClassroom()" title="Opções do Classroom" class="hidden text-gray-400 hover:text-gray-600 p-1.5 text-xs">
        <i class="fas fa-cog"></i>
      </button>
      <img src="/static/logo.png" alt="Logo CEDESP" class="h-9 object-contain">
    </div>
  </header>

  <div class="w-full mx-auto mt-6 main-container">
    <nav class="flex border border-gray-200 rounded-xl overflow-hidden text-center text-sm font-medium text-gray-700 mb-6 bg-white shadow-sm w-full" role="tablist" aria-label="Navegação do painel">
      <button class="nav-tab flex-1 py-3 border-r border-gray-200 bg-white text-blue-600 font-bold" role="tab" aria-selected="true" tabindex="0" type="button" onclick="switchTab('alunos')">
        <i class="fas fa-users mr-1.5"></i> Alunos
      </button>
      <button class="nav-tab flex-1 py-3 border-r border-gray-200" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('chamada')">
        <i class="fas fa-clipboard-check mr-1.5"></i> Chamada
      </button>
      <button class="nav-tab flex-1 py-3 border-r border-gray-200" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('notas')">
        <i class="fas fa-star mr-1.5"></i> Notas
      </button>
      <button class="nav-tab flex-1 py-3 border-r border-gray-200" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('advertencias_faltas')">
        <i class="fas fa-exclamation-triangle mr-1.5"></i> Advertências
      </button>
      <button class="nav-tab flex-1 py-3 border-r border-gray-200" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('notificacoes')">
        <i class="fas fa-bell mr-1.5"></i> Notificações
      </button>
      <button class="nav-tab flex-1 py-3 border-r border-gray-200" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('fichas_individuais')">
        <i class="fas fa-id-card mr-1.5"></i> Fichas
      </button>
      <button class="nav-tab flex-1 py-3" role="tab" aria-selected="false" tabindex="-1" type="button" onclick="switchTab('boletim')">
        <i class="fas fa-file-alt mr-1.5"></i> Boletins
      </button>
    </nav>

    <section id="content-area" class="w-full"></section>

    <div id="notas-container" class="hidden"></div>
    <div id="notificacoes-container" class="hidden"></div>
    <div id="advertencias-faltas-container" class="hidden"></div>
    <div id="fichas-individuais-container" class="hidden"></div>
    <div id="boletins-container" class="hidden"></div>
    <div id="chamada-container" class="hidden"></div>
  </div>

  <!-- MODAL: NOVO ALUNO NA TURMA -->
  <div id="modal-adicionar-aluno" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
          <i class="fas fa-user-plus text-blue-600"></i> Matricular Novo Aluno
        </h3>
        <button onclick="fecharModalAdicionarAluno()" class="text-gray-400 hover:text-gray-600 text-lg">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form id="form-adicionar-aluno" onsubmit="salvarNovoAluno(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nome Completo *</label>
          <input type="text" id="novo-aluno-nome" required placeholder="Ex: Lucas Silva Santos" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nº Matrícula</label>
            <input type="text" id="novo-aluno-matricula" placeholder="Ex: 2026001" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Telefone / Celular</label>
            <input type="text" id="novo-aluno-telefone" placeholder="(11) 99999-9999" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email</label>
          <input type="email" id="novo-aluno-email" placeholder="aluno@email.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <p class="text-xs text-gray-500">
          * O aluno será matriculado com status <strong>Ativo</strong> na turma <strong>{{ turma_nome }} ({{ turno }})</strong>.
        </p>
        <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
          <button type="button" onclick="fecharModalAdicionarAluno()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Matricular Aluno</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VINCULAR SALA DO CLASSROOM DO PROFESSOR -->
  <div id="modal-vincular-classroom" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-gray-100">
        <h3 class="text-base font-bold text-gray-900 flex items-center gap-2">
          <i class="fab fa-google text-emerald-600"></i> Vincular ao Google Classroom
        </h3>
        <button onclick="fecharModalVincularClassroom()" class="text-gray-400 hover:text-gray-600 text-lg">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="mt-4">
        <p class="text-xs text-gray-600 mb-3">
          Selecione qual das salas da sua conta Google Classroom corresponde a esta turma oficial (<strong>{{ turma_nome }}</strong>):
        </p>

        <div id="lista-salas-vincular" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <!-- Renderizado via JS -->
        </div>

        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
          <button onclick="desvincularTurma()" id="btn-desvincular-turma" class="hidden text-xs text-rose-600 hover:text-rose-800 font-semibold flex items-center gap-1">
            <i class="fas fa-unlink"></i> Desvincular Classroom
          </button>
          <button onclick="fecharModalVincularClassroom()" class="px-4 py-2 text-xs text-gray-600 hover:bg-gray-100 rounded-lg ml-auto">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.turmaNome = "{{ turma_nome }}";
    window.turmaTurno = "{{ turno }}";
  </script>

  <script src="{{ url_for('static', filename='js/turma.js') }}?v=6"></script>
  <script src="{{ url_for('static', filename='js/advertencias.js') }}?v=4"></script>
  <script src="{{ url_for('static', filename='js/advertencias_faltas.js') }}?v=2"></script>
  <script src="{{ url_for('static', filename='js/fichas_individuais.js') }}?v=1"></script>
</body>
</html>
