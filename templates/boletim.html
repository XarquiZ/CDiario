<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/font-awesome.min.css">
  
  <style>
    body, section, aside, div, h2, h3, ul, li, button, p, time {
      font-family: 'Inter', sans-serif !important;
      box-sizing: border-box !important;
    }
    section {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }
    aside {
      padding-left: 0 !important;
      padding-right: 0 !important;
      width: 280px !important;
      flex-shrink: 0;
      max-height: 500px;
      overflow-y: auto;
      border-right: 1px solid #e5e7eb;
    }
    #boletim-section {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: calc(100% - 280px) !important;
    }
    #boletim-list {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: 100% !important;
    }
    .print-all-btn {
      background-color: #1E90FF !important;
      color: white !important;
      border-radius: 0.375rem !important;
      padding: 0.5rem 1rem !important;
      font-weight: 600 !important;
    }
    .print-all-btn:hover {
      background-color: #1E70FF !important;
    }
    .print-all-btn:disabled {
      background-color: #A1A1AA !important;
      cursor: not-allowed;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    #alunos-list-boletins button {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #boletim-list, #alunos-list-boletins {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #boletim-list.fade-out, #alunos-list-boletins.fade-out {
      opacity: 0;
    }
    #boletim-list.fade-in, #alunos-list-boletins.fade-in {
      opacity: 1;
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #boletim-list p.text-gray-600 {
      font-style: italic;
    }
    #boletim-list article {
      min-width: 250px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      padding-bottom: 0.5rem; /* Espaçamento interno ajustado */
      display: flex;
      flex-direction: column;
      height: auto; /* Altura ajustada dinamicamente */
    }
    /* Estilo para limitar a 4 linhas e adicionar expansão */
    .card-content {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-height: 6.0rem; /* Ajustado para 4 linhas com base na fonte */
    }
    .card-content.expanded {
      -webkit-line-clamp: unset;
      max-height: none;
    }
    .card-header {
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.75rem;
      color: #1E293B;
      border-bottom: 1px solid #e5e7eb;
    }
    .card-average {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      font-weight: 800;
      font-size: 0.75rem;
      color: #1E293B;
      background-color: #f3f4f6;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #2563EB;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .toggle-btn:hover {
      color: #1d4ed8;
    }
    .card-footer {
      margin-top: 0; /* Removido margin-top padrão */
      padding-bottom: 0.5rem; /* Pequeno espaçamento interno */
    }
  </style>
</head>
<body class="bg-[#F8FAFF] text-[#1E293B]">
  <div class="title-row">
    <h2 class="font-extrabold text-[#0F172A] text-xl" id="section-title">Gerenciamento de Boletins</h2>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="print-all-btn inline-flex items-center gap-2 text-sm font-semibold rounded-md px-4 py-2"
        disabled
      >
        <i class="fas fa-print"></i> Imprimir Todos
      </button>
    </div>
  </div>
  <section class="flex flex-col md:flex-row gap-6 w-full">
    <aside class="flex flex-col gap-4 bg-white rounded-md py-4 px-4 shadow-sm">
      <h3 class="font-semibold text-base text-[#1E293B] mb-2 sr-only">Alunos</h3>
      <ul class="flex flex-col gap-3 text-sm" id="alunos-list-boletins">
        <!-- Alunos serão renderizados aqui pelo JavaScript -->
      </ul>
    </aside>
    <div class="flex-1 flex flex-col gap-4" id="boletim-section">
      <h3 class="font-semibold text-[#1E293B] text-lg mb-4" id="aluno-boletim-title"></h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full" id="boletim-list">
        <!-- Boletins serão renderizados aqui pelo JavaScript -->
      </div>
    </div>
  </section>

  <script src="/static/js/boletim.js?v=2"></script>
</body>
</html>
