<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDiario - Painel do Professor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#F8FAFF] min-h-screen font-['Inter']">
  <!-- Header do Professor -->
  <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 bg-white sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-4">
      <button class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition font-medium text-sm" onclick="window.location.href='/'">
        <i class="fas fa-arrow-left"></i>
        <span>Início</span>
      </button>
      <div class="h-5 w-px bg-gray-300"></div>
      <h1 class="font-extrabold text-[#2563EB] text-lg select-none">CDiario • Diário de Classe</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-500 font-medium hidden sm:inline">Ambiente do Professor</span>
      <img src="/static/logo.png" alt="Logo CEDESP" class="h-9 object-contain">
    </div>
  </header>

  <!-- Banner de Feedback (ex: Retorno da autorização do Google) -->
  <div id="alert-banner" class="hidden max-w-6xl mx-auto mt-4 px-4"></div>

  <!-- Barra Superior: Boas-vindas -->
  <div class="max-w-6xl mx-auto px-4 pt-6 pb-2">
    <div class="pb-3 border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900">Minhas Turmas</h2>
      <p class="text-gray-500 text-sm mt-0.5">Selecione uma turma para realizar chamada, lançar notas ou consultar fichas dos alunos.</p>
    </div>
  </div>

  <!-- Barra de Filtros (Turno, Semestre, Ativas/Arquivadas) -->
  <div class="max-w-6xl mx-auto px-4 py-4">
    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <!-- Filtro Turno -->
        <label class="flex items-center gap-2 text-xs font-semibold text-gray-700">
          <span>Turno:</span>
          <select id="turno-select" onchange="filterTurmas()" class="bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">Todos os turnos</option>
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
            <option value="Noite">Noite</option>
          </select>
        </label>

        <!-- Filtro Semestre -->
        <label class="flex items-center gap-2 text-xs font-semibold text-gray-700">
          <span>Semestre:</span>
          <select id="semestre-select" onchange="filterTurmas()" class="bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">Todos os semestres</option>
            <option value="2026.1" selected>2026.1 (Atual)</option>
            <option value="2026.2">2026.2</option>
            <option value="2025.2">2025.2</option>
            <option value="2025.1">2025.1</option>
          </select>
        </label>
      </div>

      <!-- Toggle Ativas vs Arquivadas -->
      <div class="flex items-center bg-gray-100 p-1 rounded-lg text-xs font-semibold self-stretch md:self-auto justify-center">
        <button id="tab-ativas" onclick="setStatusFilter('ativa')" class="px-4 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition">
          <i class="fas fa-folder-open mr-1"></i> Ativas
        </button>
        <button id="tab-arquivadas" onclick="setStatusFilter('arquivada')" class="px-4 py-1.5 rounded-md text-gray-600 hover:text-gray-900 transition">
          <i class="fas fa-archive mr-1"></i> Arquivadas
        </button>
      </div>
    </div>
  </div>

  <!-- Grid de Turmas do Professor -->
  <main class="max-w-6xl mx-auto px-4 pb-16">
    <div id="turmas-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Turmas renderizadas pelo JavaScript -->
    </div>
  </main>

  <script src="/static/js/professor.js?v=6"></script>
</body>
</html>
