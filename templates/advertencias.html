<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertências</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/font-awesome.min.css">
  <style>
    body, section, aside, div, h2, h3, ul, li, button, p, time {
      font-family: 'Inter', sans-serif !important;
      box-sizing: border-box !important;
    }
    section {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }
    aside {
      padding-left: 0 !important;
      padding-right: 0 !important;
      width: 280px !important;
      flex-shrink: 0;
      max-height: 500px;
      overflow-y: auto;
      border-right: 1px solid #e5e7eb;
    }
    #advertencias-section {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: calc(100% - 280px) !important;
    }
    #advertencias-list {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: 100% !important;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    @media (max-width: 640px) {
      #advertencias-list {
        grid-template-columns: 1fr;
      }
      #advertencias-list article {
        min-width: 100%;
        max-width: 100%;
      }
    }
    @media (min-width: 641px) and (max-width: 1024px) {
      #advertencias-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #advertencias-list article {
        min-width: 0;
        max-width: 100%;
      }
    }
    @media (min-width: 1025px) {
      #advertencias-list {
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      }
      #advertencias-list article {
        min-width: 0;
        max-width: 100%;
      }
    }
    .nova-advertencia-btn, .print-all-btn {
      background-color: #1E90FF !important;
      color: white !important;
      border-radius: 0.375rem !important;
      padding: 0.5rem 1rem !important;
      font-weight: 600 !important;
    }
    .nova-advertencia-btn:hover, .print-all-btn:hover {
      background-color: #1E70FF !important;
    }
    .nova-advertencia-btn:disabled, .print-all-btn:disabled {
      background-color: #A1A1AA !important;
      cursor: not-allowed;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0;
    }
    #alunos-list-advertencias button {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #advertencias-list, #alunos-list-advertencias {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #advertencias-list.fade-out, #alunos-list-advertencias.fade-out {
      opacity: 0;
    }
    #advertencias-list.fade-in, #alunos-list-advertencias.fade-in {
      opacity: 1;
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #nova-advertencia-modal {
      animation: fadeInModal 0.3s ease forwards;
    }
    @keyframes fadeInModal {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    #advertencias-list p.text-gray-600 {
      font-style: italic;
    }
    #advertencias-list article {
      min-width: 0;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      padding-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
      height: auto;
    }
    .card-content {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-height: 6.0rem;
    }
    .card-header {
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.75rem;
      color: #1E293B;
      border-bottom: 1px solid #e5e7eb;
    }
    #search-input {
      padding-left: 2.5rem;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-content, #print-content * {
        visibility: visible;
      }
      #print-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        font-family: 'Inter', sans-serif;
      }
      .signature-line {
        border-top: 1px solid #000;
        width: 250px;
        margin-top: 10px;
        padding-top: 5px;
      }
      .advertencia-print {
        page-break-inside: avoid;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body class="bg-[#F8FAFF] text-[#1E293B]">
  <div class="title-row">
    <h2 class="font-extrabold text-[#0F172A] text-xl" id="section-title">Gerenciamento de Notificações</h2>
    <div class="flex items-center gap-2">
      <div class="relative">
        <input
          type="text"
          id="search-input"
          class="border border-gray-300 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Pesquisar notificações..."
        >
        <button
          type="button"
          id="search-btn"
          class="absolute left-0 top-0 h-full px-3 text-gray-500 hover:text-gray-700"
        >
          <i class="fas fa-search"></i>
        </button>
      </div>
      <button
        type="button"
        class="print-all-btn inline-flex items-center gap-2 text-sm font-semibold rounded-md px-4 py-2"
        disabled
      >
        <i class="fas fa-print"></i> Imprimir Todas
      </button>
      <button
        type="button"
        class="nova-advertencia-btn inline-flex items-center gap-2 text-sm font-semibold rounded-md px-4 py-2"
        disabled
      >
        <i class="fas fa-plus"></i> Nova Notificação
      </button>
    </div>
  </div>
  <div id="advertencias-container">
    <section class="flex flex-col md:flex-row gap-6 w-full">
      <aside class="flex flex-col gap-4 bg-white rounded-md py-4 px-4 shadow-sm">
        <h3 class="font-semibold text-base text-[#1E293B] mb-2 sr-only">Alunos</h3>
        <ul class="flex flex-col gap-3 text-sm" id="alunos-list-advertencias"></ul>
      </aside>
      <div class="flex-1 flex flex-col gap-4" id="advertencias-section">
        <h3 class="font-semibold text-[#1E293B] text-lg mb-4" id="aluno-advertencias-title"></h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 w-full" id="advertencias-list">
          <article class="bg-white rounded-md p-4 shadow-sm text-center" style="box-sizing: border-box;">
            <p class="text-gray-600">Carregando advertências...</p>
          </article>
        </div>
      </div>
    </section>
  </div>
  <script src="/static/js/advertencias.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const aluno = urlParams.get('aluno');
      const turma = urlParams.get('turma');
      const turno = urlParams.get('turno');

      // Verifica se TODOS os parâmetros necessários estão presentes
      if (aluno && turma && turno) {
        window.turmaNome = decodeURIComponent(turma);
        window.turmaTurno = decodeURIComponent(turno);
        console.log('Parâmetros encontrados na URL:', { aluno, turma, turno });
        // Chama renderAlunosListAdvertencias com o aluno selecionado
        window.renderAlunosListAdvertencias({
          selectedAluno: {
            nome: decodeURIComponent(aluno),
            turma: decodeURIComponent(turma),
            turno: decodeURIComponent(turno)
          }
        });
      } else {
        console.warn('Parâmetros aluno, turma ou turno ausentes na URL:', { aluno, turma, turno });
        // Define valores padrão para turma e turno se não estiverem na URL
        window.turmaNome = window.turmaNome || decodeURIComponent(turma || 'Turma Não Definida');
        window.turmaTurno = window.turmaTurno || decodeURIComponent(turno || 'Turno Não Definido');
        // Chama renderAlunosListAdvertencias sem aluno selecionado para carregar a lista de alunos
        window.renderAlunosListAdvertencias();
      }
    });
  </script>
</body>
</html>
